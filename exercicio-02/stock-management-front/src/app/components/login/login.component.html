<form (ngSubmit)="onSubmitCredentials(username.value, password.value)" #form>
  <p>
    <label for="username">Username</label>
    <input id="username" type="text" name="username" #username />
  </p>
  <p>
    <label for="password">Password</label>
    <input id="password" type="password" name="password" #password/>
  </p>
  <p id="submitLogin">
    <button>Login</button>
  </p>
</form>
<form (ngSubmit)="onSubmitTest()" #form2>
  <p id="submitTest">
    <button>test</button>
  </p>
</form>
